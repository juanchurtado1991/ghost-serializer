name: Ghost CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-jvm:
    name: Tests (JVM)
    runs-on: ubuntu-latest
    permissions:
      # Only this job pushes the coverage report back to main; every other job stays read-only.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: JVM test suite (ciTestJvm)
        run: ./gradlew ciTestJvm

      - name: Generate Kover coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew koverHtmlReport

      - name: Publish coverage report to docs/coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf docs/coverage
          mkdir -p docs/coverage
          cp -r build/reports/kover/html/. docs/coverage/
          touch docs/coverage/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage

          if git diff --cached --quiet; then
            echo "Coverage report unchanged, nothing to commit."
          else
            git commit -m "chore: update coverage report [skip ci]"
            # docs/coverage is fully regenerated, not hand-authored — Kover's HTML isn't
            # byte-stable across runs, so a plain rebase against a concurrent coverage-report
            # commit conflicts on nearly every file even when both reflect the same underlying
            # coverage. Let this run's freshly generated report win outright instead of trying
            # to line-merge two generated-HTML trees.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

  test-android:
    name: Tests (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ghost-serialization Android unit tests
        run: ./gradlew :ghost-serialization:testAndroidHostTest

  test-ios:
    name: Tests (iOS)
    # Apple Silicon + Xcode required; iosSimulatorArm64Test is SKIPPED on Linux/Intel runners.
    # macos-26 keeps a current Xcode 26.x toolchain for Kotlin/Native (minimum supported Kotlin: 2.2.21).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ghost-serialization iOS simulator tests
        run: |
          set -euo pipefail
          log="$(mktemp)"
          # K/N iOS tests do not print "N tests completed" (unlike JVM JUnit). Trust Gradle exit code.
          ./gradlew :ghost-serialization:kspCommonMainKotlinMetadata :ghost-serialization:iosSimulatorArm64Test --rerun-tasks --console=plain 2>&1 | tee "$log"
          gradle_exit="${PIPESTATUS[0]}"
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo "::error::Gradle exited with $gradle_exit"
            exit "$gradle_exit"
          fi
          if grep -q "> Task :ghost-serialization:iosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::iosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + Apple Silicon)"
            exit 1
          fi
          if grep -q "> Task :ghost-serialization:iosSimulatorArm64Test FAILED" "$log"; then
            echo "::error::iosSimulatorArm64Test task failed"
            exit 1
          fi
          echo "iosSimulatorArm64Test completed (BUILD SUCCESSFUL)"

  consumer-compat:
    name: Consumer compatibility (Kotlin 2.2.21)
    # Publishes Ghost to mavenLocal and builds compat-tests/kotlin-consumer, a standalone two-module KMP project on
    # the minimum supported Kotlin (2.2.21) using the Ghost Gradle plugin. Proves the published klibs/metadata, the
    # KSP-generated code and automatic Native/Wasm registration (compiler plugin) work for consumers: round-trip
    # tests with no Ghost.addRegistry call on JVM, the iOS simulator and Wasm (Node.js).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Ghost to mavenLocal
        run: ./gradlew :ghost-api:publishToMavenLocal :ghost-serialization:publishToMavenLocal :ghost-compiler:publishToMavenLocal :ghost-compiler-plugin:publishToMavenLocal :ghost-gradle-plugin:publishToMavenLocal :ghost-ktor:publishToMavenLocal -PskipTests --console=plain

      - name: Build and test the Kotlin 2.2.21 consumer (JVM, Android, iOS simulator, Wasm)
        run: |
          set -euo pipefail
          log="$(mktemp)"
          ./gradlew -p compat-tests/kotlin-consumer jvmTest compileAndroidMain iosSimulatorArm64Test wasmJsNodeTest --console=plain 2>&1 | tee "$log"
          gradle_exit="${PIPESTATUS[0]}"
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo "::error::Gradle exited with $gradle_exit"
            exit "$gradle_exit"
          fi
          if grep -q "> Task :iosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::consumer iosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + Apple Silicon)"
            exit 1
          fi

  consumer-compat-newer-kotlin:
    name: Consumer compatibility (Kotlin ${{ matrix.kotlin }})
    # The same consumer on newer Kotlin releases. ghost-compiler-plugin is compiled against 2.2.21 and must
    # still load on newer compilers (their plugin APIs change between releases — see GhostCompilerCompat).
    # compileKotlinIosArm64 runs the plugin on Kotlin/Native without a Mac; the simulator run stays in
    # consumer-compat. Keep the matrix in sync with kotlin-plugin-tested in gradle/libs.versions.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kotlin: [ '2.3.21', '2.4.0' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Ghost to mavenLocal
        run: ./gradlew :ghost-api:publishToMavenLocal :ghost-serialization:publishToMavenLocal :ghost-compiler:publishToMavenLocal :ghost-compiler-plugin:publishToMavenLocal :ghost-gradle-plugin:publishToMavenLocal :ghost-ktor:publishToMavenLocal -PskipTests --console=plain

      - name: Build and test the consumer on Kotlin ${{ matrix.kotlin }} (JVM, Android, Wasm, Native compile)
        run: ./gradlew -p compat-tests/kotlin-consumer -PkotlinVersion=${{ matrix.kotlin }} jvmTest wasmJsNodeTest compileAndroidMain compileKotlinIosArm64 --console=plain

  test-wasm:
    name: Tests (WasmJs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP wasmJs browser tests
        run: >
          ./gradlew
          :ghost-api:wasmJsBrowserTest
          :ghost-serialization:wasmJsBrowserTest
          :ghost-ktor:wasmJsBrowserTest
          :ghost-playground:compileKotlinWasmJs

  publish-playground:
    name: Publish Ghost Playground (docs/)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [test-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and publish playground to docs/
        run: ./gradlew :ghost-playground:publishToDocs

      - name: Commit playground site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Playground site unchanged, nothing to commit."
          else
            git commit -m "chore: update ghost playground [skip ci]"
            # Same reasoning as the coverage-report publish step: docs/ here is a fully
            # regenerated wasm build output, not hand-authored — prefer this run's fresh build
            # outright on conflict instead of line-merging generated artifacts.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

  publish-check:
    name: Publish dry-run (Maven Local)
    runs-on: ubuntu-latest
    needs: [test-jvm, test-android, test-ios, test-wasm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish all modules to Maven Local
        run: ./gradlew publishToMavenLocal -PskipTests

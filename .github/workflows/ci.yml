name: Ghost CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-jvm:
    name: Tests (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: JVM test suite (ciTestJvm)
        run: ./gradlew ciTestJvm

      - name: Generate Kover coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew koverHtmlReport

      # The report is published to GitHub Pages by the publish-site job; nothing is committed to main.
      - name: Upload coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/html
          retention-days: 7

  test-android:
    name: Tests (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ghost-serialization Android unit tests
        run: ./gradlew :ghost-serialization:testAndroidHostTest

  test-ios:
    name: Tests (iOS)
    # Apple Silicon + Xcode required; iosSimulatorArm64Test is SKIPPED on Linux/Intel runners.
    # macos-26 keeps a current Xcode 26.x toolchain for Kotlin/Native (minimum supported Kotlin: 2.2.21).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ghost-serialization iOS simulator tests
        run: |
          set -euo pipefail
          log="$(mktemp)"
          # K/N iOS tests do not print "N tests completed" (unlike JVM JUnit). Trust Gradle exit code.
          ./gradlew :ghost-serialization:kspCommonMainKotlinMetadata :ghost-serialization:iosSimulatorArm64Test --rerun-tasks --console=plain 2>&1 | tee "$log"
          gradle_exit="${PIPESTATUS[0]}"
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo "::error::Gradle exited with $gradle_exit"
            exit "$gradle_exit"
          fi
          if grep -q "> Task :ghost-serialization:iosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::iosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + Apple Silicon)"
            exit 1
          fi
          if grep -q "> Task :ghost-serialization:iosSimulatorArm64Test FAILED" "$log"; then
            echo "::error::iosSimulatorArm64Test task failed"
            exit 1
          fi
          echo "iosSimulatorArm64Test completed (BUILD SUCCESSFUL)"

  test-watchos:
    name: Tests (watchOS)
    # Same as test-ios on the watchOS simulator (watchosSimulatorArm64) for the modules that publish watchOS.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure a watchOS simulator runtime
        run: xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS

      - name: watchOS simulator tests
        run: |
          set -euo pipefail
          log="$(mktemp)"
          ./gradlew ciTestWatchos --rerun-tasks --console=plain 2>&1 | tee "$log"
          gradle_exit="${PIPESTATUS[0]}"
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo "::error::Gradle exited with $gradle_exit"
            exit "$gradle_exit"
          fi
          if grep -qE "> Task :ghost-[a-z]+:watchosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::a watchosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + a watchOS simulator)"
            exit 1
          fi
          echo "watchosSimulatorArm64Test completed (BUILD SUCCESSFUL)"

  consumer-compat:
    name: Consumer compatibility (Kotlin 2.2.21)
    # Publishes Ghost to mavenLocal and builds compat-tests/kotlin-consumer, a standalone two-module KMP project on
    # the minimum supported Kotlin (2.2.21) using the Ghost Gradle plugin. Proves the published klibs/metadata, the
    # KSP-generated code and automatic Native/Wasm registration (compiler plugin) work for consumers: round-trip
    # tests with no Ghost.addRegistry call on JVM, the iOS and watchOS simulators and Wasm (Node.js).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure a watchOS simulator runtime
        run: xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS

      - name: Publish Ghost to mavenLocal
        run: ./gradlew :ghost-api:publishToMavenLocal :ghost-serialization:publishToMavenLocal :ghost-compiler:publishToMavenLocal :ghost-compiler-plugin:publishToMavenLocal :ghost-gradle-plugin:publishToMavenLocal :ghost-ktor:publishToMavenLocal -PskipTests --console=plain

      - name: Build and test the Kotlin 2.2.21 consumer (JVM, Android, iOS and watchOS simulators, Wasm)
        run: |
          set -euo pipefail
          log="$(mktemp)"
          ./gradlew -p compat-tests/kotlin-consumer jvmTest compileAndroidMain checkAndroidMainAarMetadata iosSimulatorArm64Test watchosSimulatorArm64Test wasmJsNodeTest --console=plain 2>&1 | tee "$log"
          gradle_exit="${PIPESTATUS[0]}"
          if [[ "$gradle_exit" -ne 0 ]]; then
            echo "::error::Gradle exited with $gradle_exit"
            exit "$gradle_exit"
          fi
          if grep -q "> Task :iosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::consumer iosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + Apple Silicon)"
            exit 1
          fi
          if grep -q "> Task :watchosSimulatorArm64Test SKIPPED" "$log"; then
            echo "::error::consumer watchosSimulatorArm64Test was SKIPPED (needs macOS + Xcode + a watchOS simulator)"
            exit 1
          fi

  consumer-compat-newer-kotlin:
    name: Consumer compatibility (Kotlin ${{ matrix.kotlin }})
    # The same consumer on newer Kotlin releases. ghost-compiler-plugin is compiled against 2.2.21 and must
    # still load on newer compilers (their plugin APIs change between releases — see GhostCompilerCompat).
    # compileKotlinIosArm64 runs the plugin on Kotlin/Native without a Mac; the simulator run stays in
    # consumer-compat. Keep the matrix in sync with kotlin-plugin-tested in gradle/libs.versions.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kotlin: [ '2.3.21', '2.4.0' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Ghost to mavenLocal
        run: ./gradlew :ghost-api:publishToMavenLocal :ghost-serialization:publishToMavenLocal :ghost-compiler:publishToMavenLocal :ghost-compiler-plugin:publishToMavenLocal :ghost-gradle-plugin:publishToMavenLocal :ghost-ktor:publishToMavenLocal -PskipTests --console=plain

      - name: Build and test the consumer on Kotlin ${{ matrix.kotlin }} (JVM, Android, Wasm, Native compile)
        run: ./gradlew -p compat-tests/kotlin-consumer -PkotlinVersion=${{ matrix.kotlin }} jvmTest wasmJsNodeTest compileAndroidMain checkAndroidMainAarMetadata compileKotlinIosArm64 compileKotlinWatchosArm64 --console=plain

  test-wasm:
    name: Tests (WasmJs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP wasmJs browser tests
        run: >
          ./gradlew
          :ghost-api:wasmJsBrowserTest
          :ghost-serialization:wasmJsBrowserTest
          :ghost-ktor:wasmJsBrowserTest
          :ghost-playground:compileKotlinWasmJs

  publish-site:
    name: Publish site (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [test-jvm, test-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages source must be "GitHub Actions" (Settings > Pages). The site is assembled here and deployed as an
    # artifact, so nothing generated is committed to main (the ruleset on main requires an approved PR).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the playground into docs/
        run: ./gradlew :ghost-playground:publishToDocs

      - name: Add the coverage report to docs/coverage
        run: |
          rm -rf docs/coverage
          mkdir -p docs/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-check:
    name: Publish dry-run (Maven Local)
    runs-on: ubuntu-latest
    needs: [test-jvm, test-android, test-ios, test-wasm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish all modules to Maven Local
        run: ./gradlew publishToMavenLocal -PskipTests
